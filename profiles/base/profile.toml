description = "Debian with claude, git, tmux, and sshd"

[backend.docker]
image = "ccvm/base:latest"

[backend.k8s]
image = "ccvm/base:latest"

[backend.orbstack]
template = "ccvm-base"

[backend.proxmox]
lxc_template = 9000
vm_template  = 9100

# No code_mode: it would shadow the per-backend default, which is mount on
# docker and orbstack, rsync on proxmox, and git on k8s.
[defaults]
backend = "docker"
ttl     = "12h"

[resources]
cpus   = 2
memory = "4G"
disk   = "16G"
